[package]
name = "qala-compiler"
version = "0.1.0"
edition = "2024"
description = "Compiler and bytecode VM for the Qala programming language"
license = "MIT"
rust-version = "1.95.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Versions verified on crates.io at scaffold time.
# After first `cargo build`, the resolved versions are pinned in Cargo.lock; commit it.
# wasm-bindgen must match the wasm-pack version; do not bump independently.
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
