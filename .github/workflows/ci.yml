name: CI

# verifies the workspace and the playground on every push and pull request.
# a single ubuntu job: the rust gate (format, clippy, tests), the wasm build,
# then the playground typecheck, lint, and build.

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: check out the repository
        uses: actions/checkout@v6

      - name: install the rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: check formatting
        run: cargo fmt --all -- --check

      - name: run clippy
        run: cargo clippy --workspace -- -D warnings

      - name: run the workspace tests
        run: cargo test --workspace

      - name: install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: build the wasm module
        # wasm-pack's --out-dir is relative to the crate, not the working
        # directory, so the path climbs two levels back to the workspace root.
        run: wasm-pack build crates/qala-compiler --target web --out-dir ../../playground/lib/wasm

      - name: install node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playground/package-lock.json

      - name: install the playground dependencies
        run: npm ci
        working-directory: playground

      - name: typecheck the playground
        run: npm run typecheck
        working-directory: playground

      - name: lint the playground
        run: npm run lint
        working-directory: playground

      - name: build the playground
        run: npm run build
        working-directory: playground
