name: Release

# builds the qala command-line binary for Linux, macOS, and Windows and
# attaches each to the GitHub Release when a version tag (v*) is pushed.
# the create-release job creates the release once; the upload-assets matrix
# then builds the native binary on each runner and attaches it. without
# the create step, taiki-e/upload-rust-binary-action would loop on
# "release not found" because pushing a tag does not, on its own, create
# a github release.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# opt every javascript action into node 24, ahead of github's forced flip on
# 2026-06-02. avoids the "Node.js 20 actions are deprecated" warning that
# actions/checkout@v6 and the Swatinem cache still emit on this runner.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: check out the repository
        uses: actions/checkout@v6

      - name: create the github release
        uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - name: check out the repository
        uses: actions/checkout@v6

      - name: install the rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: build and upload the qala binary
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: qala
          target: ${{ matrix.target }}
          archive: qala-$tag-$target
          token: ${{ secrets.GITHUB_TOKEN }}
