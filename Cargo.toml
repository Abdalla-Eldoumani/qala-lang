[workspace]
members = ["crates/qala-compiler", "crates/qala-cli"]
resolver = "3"

# shared dependency pins -- carried over from compiler/Cargo.toml UNCHANGED.
# qala-compiler references these with `workspace = true`.
[workspace.dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen-test = "0.3"

# WASM size profile -- moved here from the member crate.
# [profile.*] is recognized ONLY in the workspace root manifest;
# a copy in a member crate is silently ignored.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
