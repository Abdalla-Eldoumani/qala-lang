[package]
name = "qala-cli"
version = "0.1.0"
edition = "2024"
description = "Command-line interface for the Qala programming language"
license = "MIT"
rust-version = "1.95.0"
repository = "https://github.com/Abdalla-Eldoumani/qala-lang"
homepage = "https://qala-lang.vercel.app"
documentation = "https://docs.rs/qala-cli"
readme = "../../README.md"
keywords = ["compiler", "language", "cli", "repl", "interpreter"]
categories = ["command-line-utilities", "development-tools", "compilers"]

[[bin]]
name = "qala"
path = "src/main.rs"

[dependencies]
qala-compiler = { path = "../qala-compiler", version = "0.1.0" }
clap = { version = "4.6", features = ["derive"] }
reedline = "0.47"

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3.27"
